version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: sahilabel-postgres
    environment:
      POSTGRES_DB: legal_metrology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sahilabel-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
